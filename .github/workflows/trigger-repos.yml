name: Trigger repo builds

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - '.VURINFO'
      - 'README.md'
      - 'CONTRIBUTING.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trigger-repos
  cancel-in-progress: true

jobs:
  dispatch:
    name: Dispatch autobuild
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detectar paquetes cambiados
        id: changed
        shell: bash
        run: |
          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
            pkgs=""
          else
            pkgs=$(git diff --name-only "$before" "$after" -- . \
              | awk -F/ '
                  $1 == "srcpkgs" && $2 != "" {print $2; next}
                  $1 != ".github" && $1 != "" && $1 !~ /\./ {print $1}
                ' \
              | sort -u \
              | while read -r p; do [ -f "$p/template" ] && echo "$p"; done \
              | tr '\n' ' ')
          fi
          echo "pkgs=$pkgs" >> "$GITHUB_OUTPUT"
          echo "Paquetes cambiados: ${pkgs:-<ninguno>}"

      - name: Disparar repo-neko
        env:
          GH_TOKEN: ${{ secrets.PR_TOKEN || secrets.GITHUB_TOKEN }}
          PKGS: ${{ steps.changed.outputs.pkgs }}
        run: |
          set -e
          for repo in SrDicov/repo-neko Neko-Void-Linux/repo-neko; do
            active=$(gh run list -R "$repo" --workflow autobuild.yml \
              --json status --jq '[.[]|select(.status!="completed")]|length' 2>/dev/null || echo 0)
            if [ "$active" -gt 0 ]; then
              echo "skip $repo: $active run(s) already active"
              continue
            fi
            if [ -n "$PKGS" ] && gh workflow run autobuild.yml -R "$repo" --ref main \
              -f packages="$PKGS" 2>/dev/null; then
              echo "disparado $repo con paquetes: $PKGS"
              continue
            fi
            gh api -X POST "repos/$repo/dispatches" \
              -f event_type=neko-pkgs-update 2>/dev/null || echo "skip dispatch to $repo (check token or permissions)"
            echo "disparado $repo"
          done
