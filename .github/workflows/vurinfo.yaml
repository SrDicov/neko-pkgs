name: VURINFO index

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - '.VURINFO'
      - 'README.md'
      - 'CONTRIBUTING.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vurinfo
  cancel-in-progress: false

jobs:
  vurinfo:
    name: Generate root .VURINFO
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Commit and push if changed
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git fetch origin main 2>/dev/null || true
            git checkout -B main origin/main 2>/dev/null || git checkout main

            python3 .github/scripts/gen-vurinfo.py .VURINFO .
            git add .VURINFO
            if git diff --cached --quiet; then
              echo "sin cambios en .VURINFO"
              exit 0
            fi

            git commit -m "vur: regenerate root .VURINFO" || true
            if git push origin HEAD:main; then
              echo "pushed"
              exit 0
            fi

            echo "push failed (attempt $attempt), retrying..."
            git reset --soft HEAD~1 2>/dev/null || true
            sleep 2
          done

          echo "failed to push after retries" >&2
          exit 1
