name: Update packages

on:
  workflow_dispatch:
  schedule:
    - cron: '47 5 * * *'

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: update-packages
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-glibc-full
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepare container
        run: |
          xbps-install -Sy bash
          mkdir -p /etc/xbps.d
          cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/ 2>/dev/null || true
          sed -i 's|repo-default|repo-ci|g' /etc/xbps.d/*-repository-*.conf
          xbps-install -Syu xbps
          xbps-install -yu
          xbps-install -y python3 git

      - name: Detect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/detect-updates.py --json updates.json

      - name: Plan
        id: plan
        run: |
          python3 .github/scripts/plan-updates.py updates.json 5 > plan.json
          echo "matrix=$(cat plan.json)" >> "$GITHUB_OUTPUT"
          cat plan.json

  update:
    name: Update ${{ matrix.pkg }}
    needs: plan
    if: "needs.plan.outputs.matrix != '[]'"
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/void-linux/void-glibc-full
      options: --privileged
      volumes:
        - /dev:/dev
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PKG: ${{ matrix.pkg }}
      DIR: ${{ matrix.dir }}
      VER: ${{ matrix.version }}
      DISTFILES: ${{ matrix.distfiles }}
      TAG: ${{ matrix.tag }}
      REPO: ${{ github.repository }}
      TOKEN: ${{ secrets.PR_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare container
        run: |
          xbps-install -Sy bash
          mkdir -p /etc/xbps.d
          cp /usr/share/xbps.d/*-repository-*.conf /etc/xbps.d/ 2>/dev/null || true
          sed -i 's|repo-default|repo-ci|g' /etc/xbps.d/*-repository-*.conf
          xbps-install -Syu xbps
          xbps-install -yu
          xbps-install -y sudo curl git python3
          useradd -G xbuilder -M builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/builder
          git clone --depth 1 https://github.com/void-linux/void-packages.git /void-packages
          for d in "$GITHUB_WORKSPACE"/*; do
            [ -d "$d" ] || continue
            p=$(basename "$d")
            [ "$p" = ".git" ] || [ "$p" = ".github" ] && continue
            if [ -f "$d/template" ]; then
              rm -rf "/void-packages/srcpkgs/$p"
              cp -rf "$d" "/void-packages/srcpkgs/"
            fi
          done
          for l in "$GITHUB_WORKSPACE"/*; do
            [ -L "$l" ] || continue
            cp -P "$l" "/void-packages/srcpkgs/"
          done
          cat << 'EOF' >> /void-packages/common/shlibs
          libscenefx-0.5.so scenefx-latest-0.5_1
          libQt6Pas.so.6 libqt6pas-bin-6.2.10_1
          libcrypto.so.1.1 libssl1.1-1.1.1w_1
          EOF
          chown -R builder:builder /void-packages "$GITHUB_WORKSPACE"
          cd /void-packages
          sudo -Eu builder "$GITHUB_WORKSPACE/.github/ci/set_mirror.sh"
          sudo -Eu builder "$GITHUB_WORKSPACE/.github/ci/add-repo.sh" x86_64
          sudo -Eu builder "$GITHUB_WORKSPACE/.github/ci/prepare.sh"
          "$GITHUB_WORKSPACE/.github/ci/fetch-xtools.sh"

      - name: Apply version
        shell: bash
        run: |
          sudo -Eu builder env REPO_ROOT="$GITHUB_WORKSPACE" python3 \
            "$GITHUB_WORKSPACE/.github/scripts/apply-update.py" "$PKG" "$VER" "$DISTFILES" "$TAG"
          cp "$GITHUB_WORKSPACE/$DIR/template" "/void-packages/srcpkgs/$DIR/template"

      - name: Checksum
        shell: bash
        run: |
          cd /void-packages
          sudo -Eu builder env XBPS_DISTDIR="/void-packages" \
            /usr/local/bin/xgensum -f -i "srcpkgs/$DIR/template"
          cp "/void-packages/srcpkgs/$DIR/template" "$GITHUB_WORKSPACE/$DIR/template"

      - name: Lint
        shell: bash
        run: |
          python3 "$GITHUB_WORKSPACE/.github/ci/lint-templates" "$GITHUB_WORKSPACE"

      - name: Build
        id: build
        shell: bash
        run: |
          set -o pipefail
          cd /void-packages
          sudo -Eu builder ./xbps-src -Q pkg "$PKG" 2>&1 | tee /tmp/build.log

      - name: Format the template
        shell: bash
        run: |
          python3 "$GITHUB_WORKSPACE/.github/scripts/format-template.py" "$GITHUB_WORKSPACE/$DIR/template"

      - name: Push and open PR
        id: pr
        shell: bash
        run: |
          set -e
          branch="update/$PKG-$VER"
          rm -rf /tmp/pushrepo
          git clone --depth 1 --no-tags \
            "https://x-access-token:$TOKEN@github.com/$REPO.git" /tmp/pushrepo
          cd /tmp/pushrepo
          git config user.name "Dicov"
          git config user.email "SrDicov@gmail.com"
          git checkout -b "$branch"
          cp "$GITHUB_WORKSPACE/$DIR/template" "$DIR/template"
          if ! grep -qx "version=$VER" "$DIR/template"; then
            echo "::error::el template no lleva version=$VER"
            grep -m1 '^version=' "$DIR/template" || true
            exit 1
          fi
          git add "$DIR/template"
          git commit --allow-empty -m "$PKG: update to $VER."
          git push --force origin "HEAD:refs/heads/$branch"
          python3 - <<'PY' > /tmp/pr.json
          import json, os
          print(json.dumps({
              "title": f"{os.environ['PKG']}: update to {os.environ['VER']}",
              "body": "Actualización automática detectada por "
                      "detect-updates.py.\n\n"
                      f"- versión: {os.environ['VER']}\n"
                      f"- paquete: {os.environ['PKG']}\n",
              "head": f"update/{os.environ['PKG']}-{os.environ['VER']}",
              "base": "main",
          }))
          PY
          curl -s -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/pulls" \
            -d @/tmp/pr.json > /tmp/pr-resp.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, urllib.request

          d = json.load(open("/tmp/pr-resp.json"))
          if "number" not in d:
              if "already exists" in json.dumps(d):
                  url = ("https://api.github.com/repos/" + os.environ["REPO"] +
                         "/pulls?state=open&head=" +
                         os.environ["REPO"].split("/")[0] + ":" +
                         "update/" + os.environ["PKG"] + "-" +
                         os.environ["VER"])
                  req = urllib.request.Request(url, headers={
                      "Authorization": "Bearer " + os.environ["TOKEN"],
                      "Accept": "application/vnd.github+json"})
                  with urllib.request.urlopen(req) as r:
                      for pr in json.load(r):
                          print(f"number={pr['number']}")
                          print(f"url={pr['html_url']}")
                          break
              elif "not permitted to create or approve pull requests" in json.dumps(d):
                  import sys
                  print("::warning::GitHub Actions no tiene permiso para abrir PRs con GITHUB_TOKEN. Rama subida correctamente.", file=sys.stderr)
                  print("number=0")
                  print(f"url=https://github.com/{os.environ['REPO']}/tree/update/{os.environ['PKG']}-{os.environ['VER']}")
              else:
                  raise SystemExit("la API no devolvio un PR: " + json.dumps(d)[:400])
          else:
              print(f"number={d['number']}")
              print(f"url={d['html_url']}")
          PY

      - name: Report build failure
        if: failure() && steps.build.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "## Fallo de build: $PKG $VER"
            echo '```'
            tail -n 200 /tmp/build.log 2>/dev/null || echo "sin log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  merge:
    name: Merge when green
    needs: update
    if: always()
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.PR_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Merge
        shell: bash
        run: |
          repo="${{ github.repository }}"
          prs=$(gh pr list --repo "$repo" --state open --limit 50 \
            --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("update/")) | .number')
          if [ -z "$prs" ]; then
            echo "no hay PR de actualizacion abiertos"
            exit 0
          fi
          rc=0
          for pr in $prs; do
            echo "== PR #$pr"
            seen=0
            for _ in $(seq 1 40); do
              n=$(gh pr view "$pr" --repo "$repo" \
                --json statusCheckRollup --jq '.statusCheckRollup | length' \
                2>/dev/null || echo 0)
              if [ "${n:-0}" -gt 0 ]; then
                seen=1
                break
              fi
              sleep 45
            done
            if [ "$seen" -ne 1 ]; then
              echo "PR #$pr: el CI no ha registrado checks" >&2
              rc=1
              continue
            fi
            for _ in $(seq 1 160); do
                pending=$(gh pr view "$pr" --repo "$repo" \
                    --json statusCheckRollup \
                    --jq '[.statusCheckRollup[] | select(.status != null and .status != "COMPLETED")] | length' \
                    2>/dev/null || echo 1)
                [ "${pending:-0}" -eq 0 ] && break
                sleep 30
            done
            green=$(gh pr view "$pr" --repo "$repo" \
                --json statusCheckRollup \
                --jq '[.statusCheckRollup[] | select(.name != null and (.name | startswith("Build packages"))) | .conclusion] as $b | (($b | length) > 0) and ($b | all(. == "SUCCESS"))' \
                2>/dev/null || echo false)
            if [ "$green" != "true" ]; then
              echo "PR #$pr: los builds no estan en verde, no se mergea" >&2
              rc=1
              continue
            fi
            merged=0
            for attempt in 1 2 3; do
              if gh pr merge "$pr" --repo "$repo" --squash --delete-branch; then
                echo "PR #$pr mergeado"
                merged=1
                break
              fi
              echo "PR #$pr: merge fallo en intento $attempt, reintentando tras esperar..." >&2
              sleep 10
            done
            if [ "$merged" -ne 1 ]; then
              echo "PR #$pr: no se pudo mergear" >&2
              rc=1
            fi
          done
          exit $rc

      - name: Report CI failure
        if: failure()
        shell: bash
        run: |
          {
            echo "## Merge automatico abortado"
            echo "Revisa los PR abiertos (update/*): el CI no quedo en verde."
            echo "Si el PR no tiene checks, falta el secret PR_TOKEN (PAT con contents y pull_requests)."
          } >> "$GITHUB_STEP_SUMMARY"
